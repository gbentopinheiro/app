services:
  migrate:
    container_name: ${MIGRATE_CONTAINER_NAME:-bentix-production-migrate}
    build:
      context: ../../..
      dockerfile: infra/docker/app/Dockerfile
      target: migrator
      args:
        NEXT_PUBLIC_APP_ENV: local
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - bentix-net

  app:
    container_name: ${APP_CONTAINER_NAME:-bentix-production-app}
    build:
      context: ../../..
      dockerfile: infra/docker/app/Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${APP_PORT:-3300}:3000"
    volumes:
      - bentix-production-app-exports:/app/data/exports
    networks:
      - bentix-net

  db:
    image: mariadb:11.4
    container_name: ${DB_CONTAINER_NAME:-bentix-production-db}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3309}:3306"
    volumes:
      - bentix-production-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bentix-net

volumes:
  bentix-production-app-exports:
    name: bentix-production-app-exports
  bentix-production-db-data:
    name: bentix-production-db-data

networks:
  bentix-net:
    external: true
