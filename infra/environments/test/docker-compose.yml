services:
  web:
    container_name: ${WEB_CONTAINER_NAME:-bentix-test-web}
    build:
      context: ../../..
      dockerfile: infra/docker/app/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - bentix-test-exports:/app/data/exports
    networks:
      - bentix-net

  api:
    container_name: ${API_CONTAINER_NAME:-bentix-test-api}
    build:
      context: ../../..
      dockerfile: infra/docker/app/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "${API_PORT:-3101}:3000"
    volumes:
      - bentix-test-exports:/app/data/exports
    networks:
      - bentix-net

  db:
    image: mariadb:11.4
    container_name: ${DB_CONTAINER_NAME:-bentix-test-db}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - bentix-test-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - bentix-net

volumes:
  bentix-test-exports:
    name: bentix-test-exports
  bentix-test-db-data:
    name: bentix-test-db-data

networks:
  bentix-net:
    external: true
